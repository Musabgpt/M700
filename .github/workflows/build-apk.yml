name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK from ARM64 Assembly
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -n 1)"
          JAR="$SDK/platforms/$(ls "$SDK/platforms" | sort -V | tail -n 1)/android.jar"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK: $NDK"; echo "Build tools: $BT"; echo "Platform: $JAR"

          rm -rf build
          mkdir -p build/lib/arm64-v8a build/res

          # 1) Assemble + link src/calc.S -> libcalc.so (no C runtime, only libandroid)
          "$TC/bin/clang" --target=aarch64-linux-android24 -shared -nostdlib -fPIC \
            -L"$TC/sysroot/usr/lib/aarch64-linux-android/24" \
            -Wl,-soname,libcalc.so -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            -o build/lib/arm64-v8a/libcalc.so src/calc.S -landroid
          "$TC/bin/llvm-readelf" --dyn-syms build/lib/arm64-v8a/libcalc.so | grep ANativeActivity_onCreate

          # 2) Manifest + icon -> base APK
          "$BT/aapt2" compile res/drawable/ic_launcher.xml -o build/res/
          "$BT/aapt2" link -o build/unsigned.apk -I "$JAR" \
            --manifest AndroidManifest.xml build/res/*.flat

          # 3) Put the native library inside
          (cd build && zip -r unsigned.apk lib)

          # 4) Align + sign
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          base64 -d keystore/debug.keystore.b64 > build/debug.p12
          "$BT/apksigner" sign --ks build/debug.p12 --ks-type PKCS12 \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias m700 \
            --out build/M700-Calculator.apk build/aligned.apk
          "$BT/apksigner" verify --verbose build/M700-Calculator.apk
          unzip -l build/M700-Calculator.apk
          ls -la build/M700-Calculator.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: M700-Calculator
          path: build/M700-Calculator.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" build/M700-Calculator.apk \
            --repo "${{ github.repository }}" \
            --title "M700 Calculator v${{ github.run_number }}" \
            --notes "آلة حاسبة مكتوبة بالكامل بلغة ARM64 Assembly."
